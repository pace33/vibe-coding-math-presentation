<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="생활시설 · 지역 공공기관과 주민 생활"><style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.45px}</style><rect x="0" y="0" width="1400" height="800" rx="0" fill="#f4f8f3" stroke="none" stroke-width="1.8"/><rect x="45" y="33" width="1310" height="735" rx="25" fill="#fff" stroke="#d7e5da" stroke-width="1.8"/><rect x="45" y="33" width="1310" height="75" rx="20" fill="#1d4b38" stroke="#d7e5da" stroke-width="1.8"/><rect x="45" y="80" width="1310" height="28" rx="0" fill="#1d4b38" stroke="#d7e5da" stroke-width="1.8"/><text x="89" y="81" font-size="30" fill="#fff" font-weight="850" text-anchor="start">우리 지역 탐정</text><text x="1305" y="81" font-size="19" fill="#cae8d5" font-weight="650" text-anchor="end">사회 [4사09-01] · [4사10-02]</text><text x="97" y="164" font-size="35" fill="#1e4c35" font-weight="850" text-anchor="start">생활시설 · 지역 공공기관과 주민 생활</text><text x="113" y="222" font-size="26" fill="#305f46" font-weight="800" text-anchor="start">주민 생활을 돕는 기관은 어떤 역할을 할까요?</text><rect x="113" y="269" width="367" height="251" rx="16" fill="#fff" stroke="#d7e5da" stroke-width="1.8"/><text x="136" y="335" font-size="29" fill="#1d5139" font-weight="850" text-anchor="start">도서관</text><text x="136" y="390" font-size="21" fill="#64806c" font-weight="650" text-anchor="start">책·정보·문화 활동</text><rect x="136" y="444" width="305" height="49" rx="8" fill="#f1f6ef" stroke="#d7e5da" stroke-width="1.8"/><text x="289" y="477" font-size="19" fill="#3e7959" font-weight="800" text-anchor="middle">관람·견학 자료 확인</text><rect x="510" y="269" width="367" height="251" rx="16" fill="#fff" stroke="#d7e5da" stroke-width="1.8"/><text x="533" y="335" font-size="29" fill="#1d5139" font-weight="850" text-anchor="start">안전체험관</text><text x="533" y="390" font-size="21" fill="#64806c" font-weight="650" text-anchor="start">지역 안전 교육</text><rect x="533" y="444" width="305" height="49" rx="8" fill="#f1f6ef" stroke="#d7e5da" stroke-width="1.8"/><text x="686" y="477" font-size="19" fill="#3e7959" font-weight="800" text-anchor="middle">관람·견학 자료 확인</text><rect x="908" y="269" width="367" height="251" rx="16" fill="#e9f5ed" stroke="#d7e5da" stroke-width="1.8"/><text x="931" y="335" font-size="29" fill="#1d5139" font-weight="850" text-anchor="start">공공기관</text><text x="931" y="390" font-size="21" fill="#64806c" font-weight="650" text-anchor="start">주민 편의와 지역 문제</text><rect x="931" y="444" width="305" height="49" rx="8" fill="#f1f6ef" stroke="#d7e5da" stroke-width="1.8"/><text x="1084" y="477" font-size="19" fill="#3e7959" font-weight="800" text-anchor="middle">관람·견학 자료 확인</text><rect x="112" y="554" width="1172" height="106" rx="14" fill="#ecf6e8" stroke="#d7e5da" stroke-width="1.8"/><text x="144" y="601" font-size="23" fill="#346e4e" font-weight="850" text-anchor="start">지역 문제를 조사할 때, 관련 공공기관의 자료를 함께 찾습니다.</text><rect x="97" y="716" width="1198" height="1" rx="0" fill="#e4eee6" stroke="#d7e5da" stroke-width="1.8"/><text x="100" y="746" font-size="18" fill="#819a89" font-weight="500" text-anchor="start">학생용 웹앱의 기능을 설명하기 위한 재구성 예시 화면</text></svg>