<text x="131" y="263" font-size="23" font-weight="760" fill="#668472">청주시 · 하천</text><text x="131" y="326" font-size="39" font-weight="900" fill="#254939">무심천</text><text x="131" y="370" font-size="20" fill="#647f6c">지역을 흐르는 하천과 도시 생활</text>
<text x="733" y="263" font-size="23" font-weight="760" fill="#668472">음성군 · 산</text><text x="733" y="326" font-size="39" font-weight="900" fill="#254939">가섭산</text><text x="733" y="370" font-size="20" fill="#647f6c">우리 고장의 산과 숲</text>
<text x="131" y="484" font-size="23" font-weight="760" fill="#668472">옥천군 · 호수</text><text x="131" y="548" font-size="39" font-weight="900" fill="#254939">대청호</text><text x="131" y="594" font-size="20" fill="#647f6c">자연환경과 물의 이용</text>
<text x="733" y="484" font-size="23" font-weight="760" fill="#668472">진천군 · 호수</text><text x="733" y="548" font-size="39" font-weight="900" fill="#254939">초평호</text><text x="733" y="594" font-size="20" fill="#647f6c">지역 환경의 특징 관찰</text>
<rect x="99" y="665" width="1166" height="38" rx="9" fill="#e5f3e8"/><text x="132" y="692" font-size="19" font-weight="760" fill="#2f704e">출처·공식 지도 확인 → 관련 뉴스 검증 → 근거 기록으로 연결</text><text x="100" y="750" font-size="16" fill="#809789">교육용 구성 이미지 · 실제 자료 카드의 예시</text></svg>