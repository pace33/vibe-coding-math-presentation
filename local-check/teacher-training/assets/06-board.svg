size="19" fill="#71857a" font-weight="500" text-anchor="start">출처·날짜·비교 근거 정리</text><rect x="687" y="230" width="520" height="253" rx="20" fill="#fff" stroke="#dce8df" stroke-width="2"/><rect x="687" y="230" width="6" height="253" rx="3" fill="#1d7155" stroke="none" stroke-width="1"/><text x="714" y="277" font-size="28" fill="#17372d" font-weight="800" text-anchor="start">더 알아볼래요</text><text x="714" y="315" font-size="19" fill="#71857a" font-weight="500" text-anchor="start">학생의 판단과 이유를 기록</text><rect x="339" y="517" width="717" height="45" rx="12" fill="#1d7155" stroke="none" stroke-width="1"/><text x="697.5" y="547" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">나의 탐정 카드 저장</text><text x="146" y="624" font-size="20" fill="#916a36" font-weight="650" text-anchor="start">※ 같은 기기에 저장됩니다. 학급 공용 서버에 자동 공유되지는 않습니다.</text><rect x="74" y="722" width="1250" height="1" rx="0" fill="#e4ede7" stroke="none" stroke-width="1"/><text x="77" y="747" font-size="17" fill="#73877b" font-weight="500" text-anchor="start">이미지 기반 제작 과정 시연 · 화면 구성 예시</text><text x="1318" y="747" font-size="17" fill="#557566" font-weight="700" text-anchor="end">우리 지역 탐정</text></svg>