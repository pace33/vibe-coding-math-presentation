<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="우리 지역 탐정 웹앱의 전체 화면 구성 예시. 뉴스 찾기, 우리 지역, 탐정 게시판 세 가지 주요 메뉴"><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.4px}</style><rect x="0" y="0" width="1400" height="800" rx="0" fill="#eff7f1" stroke="none" stroke-width="1"/><rect x="35" y="24" width="1330" height="750" rx="22" fill="#fff" stroke="#d8e7dc" stroke-width="2"/><rect x="35" y="24" width="1330" height="66" rx="20" fill="#173d30" stroke="none" stroke-width="1"/><rect x="35" y="67" width="1330" height="23" rx="0" fill="#173d30" stroke="none" stroke-width="1"/><text x="70" y="65" font-size="16" fill="#f6c979" font-weight="700" text-anchor="start">●</text><text x="95" y="65" font-size="16" fill="#a6d6af" font-weight="700" text-anchor="start">●</text><text x="120" y="65" font-size="16" fill="#8cb6a3" font-weight="700" text-anchor="start">●</text><text x="163" y="67" font-size="27" fill="#fff" font-weight="800" text-anchor="start">우리 지역 탐정 | 웹앱 전체 화면</text><text x="1315" y="67" font-size="16" fill="#cfe8d8" font-weight="700" text-anchor="end">3개의 주요 메뉴</text><text x="85" y="155" font-size="35" fill="#153f2a" font-weight="900" text-anchor="start">🔎  우리 지역 탐정</text><rect x="86" y="181" width="400" height="61" rx="12" fill="#276b4c" stroke="#276b4c" stroke-width="1"/><text x="286" y="222" font-size="23" fill="#fff" font-weight="850" text-anchor="middle">📰  뉴스 찾기</text><rect x="499" y="181" width="400" height="61" rx="12" fill="#f9fcf9" stroke="#d1e4d6" stroke-width="1"/><text x="699" y="222" font-size="23" fill="#25563b" font-weight="850" text-anchor="middle">🗺️  우리 지역</text><rect x="912" y="181" width="400" height="61" rx="12" fill="#f9fcf9" stroke="#d1e4d6" stroke-width="1"/><text x="1112" y="222" font-size="23" fill="#25563b" font-weight="850" text-anchor="middle">🗂️  탐정 게시판</text><rect x="84" y="266" width="1231" height="162" rx="15" fill="#f7faf8" stroke="#e5eee7" stroke-width="1"/><text x="112" y="299" font-size="17" fill="#446a55" font-weight="800" text-anchor="start">지역 선택</text><text x="528" y="299" font-size="17" fill="#446a55" font-weight="800" text-anchor="start">검색어</text><rect x="107" y="314" width="382" height="58" rx="9" fill="#fff" stroke="#cfdfd2" stroke-width="1"/><text x="133" y="351" font-size="24" fill="#234635" font-weight="750" text-anchor="start">청주시  ▾</text><rect x="517" y="314" width="601" height="58" rx="9" fill="#fff" stroke="#cfdfd2" stroke-width="1"/><text x="544" y="351" font-size="21" fill="#92a99a" font-weight="500" text-anchor="start">지역 뉴스 키워드를 입력하세요</text><rect x="1135" y="314" width="154" height="58" rx="9" fill="#b65316" stroke="#b65316" stroke-width="1"/><text x="1212" y="351" font-size="20" fill="#fff" font-weight="850" text-anchor="middle">뉴스 검색</text><text x="108" y="406" font-size="17" fill="#557562" font-weight="600" text-anchor="start">지역을 선택하고 관련 뉴스를 검색해 볼 수 있어요.</text><text x="93" y="470" font-size="26" fill="#173d30" font-weight="850" text-anchor="start">검색 결과</text><text x="1307" y="470" font-size="16" fill="#5d806b" font-weight="600" text-anchor="end">기사 내용과 출처·날짜를 확인한 뒤 비교</text><rect x="87" y="491" width="600" height="204" rx="13" fill="#fff" stroke="#d7e5da" stroke-width="1.4"/><rect x="107" y="510" width="193" height="31" rx="7" fill="#fff1e6" stroke="#e9c3a6" stroke-width="1"/><text x="203" y="532" font-size="14" fill="#a14d1d" font-weight="780" text-anchor="middle">뉴스 검색 결과 예시</text><text x="109" y="575" font-size="23" fill="#244b34" font-weight="850" text-anchor="start">지역의 주요 소식을 살펴볼까요?</text><text x="109" y="605" font-size="17" fill="#a94c16" font-weight="800" text-anchor="start">출처: 원문에서 확인</text><text x="387" y="605" font-size="17" fill="#a94c16" font-weight="800" text-anchor="start">날짜: 원문에서 확인</text><rect x="107" y="620" width="557" height="47" rx="7" fill="#fff4ec" stroke="#f8d7bb" stroke-width="1"/><text x="120" y="650" font-size="16" fill="#874820" font-weight="650" text-anchor="start">기사 요약과 근거를 확인하는 공간</text><rect x="706" y="491" width="600" height="204" rx="13" fill="#fff" stroke="#d7e5da" stroke-width="1.4"/><rect x="726" y="510" width="193" height="31" rx="7" fill="#fff1e6" stroke="#e9c3a6" stroke-width="1"/><text x="822" y="532" font-size="14" fill="#a14d1d" font-weight="780" text-anchor="middle">뉴스 검색 결과 예시</text><text x="728" y="575" font-size="23" fill="#244b34" font-weight="850" text-anchor="start">다른 기사에서는 어떻게 설명할까요?</text><text x="728" y="605" font-size="17" fill="#a94c16" font-weight="800" text-anchor="start">출처: 원문에서 확인</text><text x="1006" y="605" font-size="17" fill="#a94c16" font-weight="800" text-anchor="start">날짜: 원문에서 확인</text><rect x="726" y="620" width="557" height="47" rx="7" fill="#fff4ec" stroke="#f8d7bb" stroke-width="1"/><text x="739" y="650" font-size="16" fill="#874820" font-weight="650" text-anchor="start">기사 요약과 근거를 확인하는 공간</text><text x="79" y="743" font-size="15" fill="#64826e" font-weight="500" text-anchor="start">실제 웹앱의 메뉴와 검색 화면을 바탕으로 재구성한 발표용 화면입니다.</text><text x="1315" y="743" font-size="15" fill="#2e7654" font-weight="750" text-anchor="end">사이트에서 실제 기능 시연 가능</text></svg>