<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f4ed">
<meta name="description" content="2022 개정 사회과 지역 문제 탐구와 국어 뉴스 신뢰성 평가를 근거로 한 우리 지역 탐정 웹앱 제작 기록">
<title>교과서 속 뉴스 탐구, 우리 지역 웹앱으로</title>
<link rel="stylesheet" href="style.css?v=shortprompts20261125">
<script src="slides.js?v=shortprompts20261125" defer></script>
<script src="app.js?v=promptfit20261125" defer></script>
</head>
<body>
<div class="shell">
 <header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>우리 지역 탐정</span><span class="top-desc">교실에서 만드는 AI · 지역 뉴스 검증 수업</span></div>
  <div class="top-actions">
   <button type="button" id="contentsButton" class="toolbar-btn" aria-pressed="false" aria-controls="overviewSheet" title="전체 목차 보기 (O)">목차 ☰</button>
  </div>
 </header>
 <main class="deck-wrap" id="presentation">
  <article class="slide" id="slide" aria-live="polite" aria-label="연수 발표 슬라이드">
   <div class="slide-main"><h1 class="slide-title">우리 지역, 탐정처럼 읽다</h1></div>
  </article>
 </main>
 <footer class="bottombar" aria-label="발표 이동 도구">
  <div class="left">
   <button type="button" id="prev" class="control" aria-label="이전 슬라이드 (왼쪽 화살표)">←</button>
   <span class="page-number" id="pageCounter">1 / 39</span>
   <button type="button" id="next" class="control primary" aria-label="다음 슬라이드 (오른쪽 화살표)">→</button>
  </div>
  <div class="progress-wrap" aria-hidden="true"><div class="progress-track"><div id="progressValue" class="progress-value"></div></div></div>
  <div class="right">
   <span class="shortcuts" id="currentSection">시작</span>
   <button type="button" id="notesButton" class="control" aria-pressed="false" aria-controls="notesSheet" title="발표자 메모 (N)">발표 메모</button>
   <button type="button" id="printButton" class="control" title="전체 슬라이드를 인쇄 또는 PDF 저장">PDF 저장</button>
   <button type="button" id="fullscreenButton" class="control" title="전체화면 (F)">전체 화면</button>
  </div>
 </footer>
 <p id="notice" role="status" aria-live="polite" class="visually-hidden"></p>
</div>
<div id="overviewSheet" class="sheet" role="dialog" aria-modal="true" aria-label="발표 목차" hidden>
 <div class="sheet-panel">
  <div class="sheet-header"><h2>연수 목차</h2><button class="sheet-close" type="button" id="closeOverview">닫기 ×</button></div>
  <div class="overview-grid" id="overviewGrid"></div>
 </div>
</div>
<div id="notesSheet" class="sheet" role="dialog" aria-modal="true" aria-label="발표자 메모" hidden>
 <div class="sheet-panel note-panel">
  <div class="sheet-header"><div><span class="note-title">발표자 메모</span><h2 id="pageTitle">슬라이드</h2></div><button class="sheet-close" type="button" id="closeNotes">닫기 ×</button></div>
  <p id="speakerNote"></p>
 </div>
</div>
<div id="printDeck" class="print-deck" aria-hidden="true"></div>
</body>
</html>
