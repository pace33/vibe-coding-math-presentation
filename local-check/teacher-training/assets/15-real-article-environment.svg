<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="실제 뉴스 ② · 옥천군 쓰레기 문제, 다른 시점의 기사"><style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.65px}</style><rect x="0" y="0" width="1400" height="800" rx="0" fill="#eff4ef" stroke-width="2" stroke="none"/><rect x="40" y="25" width="1320" height="750" rx="25" fill="#ffffff" stroke-width="2" stroke="#d7e4d8"/><rect x="40" y="25" width="1320" height="75" rx="22" fill="#183e30" stroke-width="2" stroke="#d7e4d8"/><rect x="40" y="77" width="1320" height="23" rx="0" fill="#183e30" stroke-width="2" stroke="#d7e4d8"/><text x="91" y="72" font-size="27" font-weight="840" fill="#e1f2e5" text-anchor="start">NEWS  /  실제 기사 정보</text><text x="1313" y="72" font-size="17" font-weight="700" fill="#b6d7c2" text-anchor="end">2026. 4월 → 9월</text><text x="85" y="153" font-size="33" font-weight="850" fill="#1d4431" text-anchor="start">실제 뉴스 ② · 옥천군 쓰레기 문제, 다른 시점의 기사</text><rect x="86" y="192" width="593" height="468" rx="15" fill="#f9fbf9" stroke-width="2" stroke="#d7e5da"/><rect x="106" y="213" width="180" height="43" rx="9" fill="#d8ecdd" stroke-width="2" stroke="none"/><text x="196" y="242" font-size="20" font-weight="840" fill="#1e6a4b" text-anchor="middle">뉴스1</text><text x="657" y="242" font-size="18" font-weight="690" fill="#6a8072" text-anchor="end">2026.04.01</text><text x="112" y="304" font-size="29" font-weight="900" fill="#203e2e" text-anchor="start">종량제봉투 파장 탓?…</text><text x="112" y="349" font-size="29" font-weight="900" fill="#203e2e" text-anchor="start">옥천군 곳곳 몰래 버린 쓰레기 몸살</text><rect x="111" y="404" width="543" height="2" rx="0" fill="#dce7de" stroke-width="2" stroke="none"/><text x="112" y="454" font-size="21" font-weight="670" fill="#4d6d59" text-anchor="start">“충북 옥천에서 불법 생활쓰레기</text><text x="112" y="495" font-size="21" font-weight="670" fill="#4d6d59" text-anchor="start">투기가 기승을 부리고 있다.”</text><rect x="112" y="584" width="541" height="48" rx="9" fill="#edf4ee" stroke-width="2" stroke="none"/><text x="133" y="615" font-size="18" font-weight="780" fill="#41765b" text-anchor="start">장인수 기자 · 4월 기사</text><rect x="717" y="192" width="597" height="468" rx="15" fill="#f9fbf9" stroke-width="2" stroke="#d7e5da"/><rect x="737" y="213" width="180" height="43" rx="9" fill="#d8ecdd" stroke-width="2" stroke="none"/><text x="827" y="242" font-size="20" font-weight="840" fill="#1e6a4b" text-anchor="middle">국제뉴스</text><text x="1292" y="242" font-size="18" font-weight="690" fill="#6a8072" text-anchor="end">2026.09.18</text><text x="743" y="304" font-size="29" font-weight="900" fill="#203e2e" text-anchor="start">옥천군, 추석 앞두고</text><text x="743" y="349" font-size="29" font-weight="900" fill="#203e2e" text-anchor="start">국토대청결 활동… 쓰레기 수거</text><rect x="742" y="404" width="547" height="2" rx="0" fill="#dce7de" stroke-width="2" stroke="none"/><text x="743" y="454" font-size="21" font-weight="670" fill="#4d6d59" text-anchor="start">하천변·도로의 쓰레기 수거 활동</text><text x="743" y="495" font-size="21" font-weight="670" fill="#4d6d59" text-anchor="start">9월 추석 전 기사 · 4월과 다른 사건</text><rect x="743" y="584" width="545" height="48" rx="9" fill="#edf4ee" stroke-width="2" stroke="none"/><text x="764" y="615" font-size="18" font-weight="780" fill="#41765b" text-anchor="start">이재기 기자 · 9월 기사</text><rect x="90" y="718" width="1220" height="1" rx="0" fill="#e0eae0" stroke-width="2" stroke="none"/><text x="93" y="748" font-size="16" font-weight="600" fill="#7b9180" text-anchor="start">실제 기사 제목·날짜·본문 일부 인용 또는 요약 / 전체 내용은 원문 링크에서 확인</text></svg>