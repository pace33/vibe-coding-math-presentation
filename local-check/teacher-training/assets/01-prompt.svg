<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-label="① 문제를 AI에게 설명하다"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6faf6"/><stop offset="1" stop-color="#e8f3eb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102d1e" flood-opacity=".09"/></filter></defs><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.6px}</style><rect x="0" y="0" width="1400" height="800" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/><rect x="37" y="27" width="1326" height="745" rx="24" fill="#fff" stroke="#dce8df" stroke-width="2"/><rect x="37" y="27" width="1326" height="70" rx="24" fill="#173d30" stroke="none" stroke-width="1"/><rect x="37" y="72" width="1326" height="25" rx="0" fill="#173d30" stroke="none" stroke-width="1"/><text x="77" y="72" font-size="17" fill="#e3e88b" font-weight="600" text-anchor="start">●</text><text x="102" y="72" font-size="17" fill="#b0d6ba" font-weight="600" text-anchor="start">●</text><text x="127" y="72" font-size="17" fill="#87b7aa" font-weight="600" text-anchor="start">●</text><text x="184" y="72" font-size="28" fill="#ffffff" font-weight="800" text-anchor="start">① 문제를 AI에게 설명하다</text><text x="1320" y="72" font-size="15" fill="#cbe6d7" font-weight="600" text-anchor="end">요구사항을 먼저 정리</text><rect x="90" y="121" width="1220" height="552" rx="26" fill="#f5f8f6" stroke="none" stroke-width="1"/><text x="130" y="169" font-size="27" fill="#17372d" font-weight="800" text-anchor="start">AI 대화 화면 예시</text><rect x="138" y="199" width="760" height="205" rx="23" fill="#e5f2e9" stroke="none" stroke-width="1"/><text x="165" y="243" font-size="19" fill="#1d7155" font-weight="800" text-anchor="start">선생님의 요청</text><text x="165" y="290" font-size="27" fill="#17372d" font-weight="700" text-anchor="start">충북 11개 시·군의 지역 정보를</text><text x="165" y="331" font-size="25" fill="#17372d" font-weight="700" text-anchor="start">초등학생이 쉽게 살펴보는 웹앱을 만들어 줘.</text><text x="165" y="367" font-size="21" fill="#4e6e5d" font-weight="600" text-anchor="start">공식 출처·날짜 표시, 뉴스 검증 기능을 포함해.</text><rect x="330" y="427" width="906" height="180" rx="24" fill="#fff" stroke="#dce8df" stroke-width="2"/><text x="361" y="467" font-size="20" fill="#1d7155" font-weight="800" text-anchor="start">AI가 제안한 구성</text><text x="361" y="509" font-size="27" fill="#17372d" font-weight="800" text-anchor="start">주요 메뉴 3개 → 지역 정보 6개 분야</text><text x="361" y="551" font-size="23" fill="#17372d" font-weight="600" text-anchor="start">뉴스 검색 → 출처·근거 비교 → 탐정 카드</text><rect x="1000" y="236" width="213" height="45" rx="12" fill="#eef7f0" stroke="none" stroke-width="1"/><text x="1106.5" y="266" font-size="20" fill="#1d7155" font-weight="800" text-anchor="middle">요구 구체화</text><rect x="74" y="722" width="1250" height="1" rx="0" fill="#e4ede7" stroke="none" stroke-width="1"/><text x="77" y="747" font-size="17" fill="#73877b" font-weight="500" text-anchor="start">이미지 기반 제작 과정 시연 · 화면 구성 예시</text><text x="1318" y="747" font-size="17" fill="#557566" font-weight="700" text-anchor="end">우리 지역 탐정</text></svg>