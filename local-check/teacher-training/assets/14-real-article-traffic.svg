<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="실제 뉴스 ① · 음성군 버스터미널 주변 교통 문제"><style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.65px}</style><rect x="0" y="0" width="1400" height="800" rx="0" fill="#eff4ef" stroke-width="2" stroke="none"/><rect x="40" y="25" width="1320" height="750" rx="25" fill="#ffffff" stroke-width="2" stroke="#d7e4d8"/><rect x="40" y="25" width="1320" height="75" rx="22" fill="#183e30" stroke-width="2" stroke="#d7e4d8"/><rect x="40" y="77" width="1320" height="23" rx="0" fill="#183e30" stroke-width="2" stroke="#d7e4d8"/><text x="91" y="72" font-size="27" font-weight="840" fill="#e1f2e5" text-anchor="start">NEWS  /  실제 기사 정보</text><text x="1313" y="72" font-size="17" font-weight="700" fill="#b6d7c2" text-anchor="end">2026. 8. 4. 실제 보도</text><text x="85" y="153" font-size="33" font-weight="850" fill="#1d4431" text-anchor="start">실제 뉴스 ① · 음성군 버스터미널 주변 교통 문제</text><rect x="86" y="192" width="593" height="468" rx="15" fill="#f9fbf9" stroke-width="2" stroke="#d7e5da"/><rect x="106" y="213" width="180" height="43" rx="9" fill="#d8ecdd" stroke-width="2" stroke="none"/><text x="196" y="242" font-size="20" font-weight="840" fill="#1e6a4b" text-anchor="middle">연합뉴스</text><text x="657" y="242" font-size="18" font-weight="690" fill="#6a8072" text-anchor="end">2026.08.04</text><text x="112" y="304" font-size="29" font-weight="900" fill="#203e2e" text-anchor="start">음성군, 혁신도시 버스터미널</text><text x="112" y="349" font-size="29" font-weight="900" fill="#203e2e" text-anchor="start">인근 불법주정차 24시간 단속</text><rect x="111" y="404" width="543" height="2" rx="0" fill="#dce7de" stroke-width="2" stroke="none"/><text x="112" y="454" font-size="21" font-weight="670" fill="#4d6d59" text-anchor="start">보행자 안전과 교통 불편을 이유로</text><text x="112" y="495" font-size="21" font-weight="670" fill="#4d6d59" text-anchor="start">8월 5일부터 단속 방식 변경</text><rect x="112" y="584" width="541" height="48" rx="9" fill="#edf4ee" stroke-width="2" stroke="none"/><text x="133" y="615" font-size="18" font-weight="780" fill="#41765b" text-anchor="start">박재천 기자 · 원문 확인 링크</text><rect x="717" y="192" width="597" height="468" rx="15" fill="#f9fbf9" stroke-width="2" stroke="#d7e5da"/><rect x="737" y="213" width="180" height="43" rx="9" fill="#d8ecdd" stroke-width="2" stroke="none"/><text x="827" y="242" font-size="20" font-weight="840" fill="#1e6a4b" text-anchor="middle">아이뉴스24</text><text x="1292" y="242" font-size="18" font-weight="690" fill="#6a8072" text-anchor="end">2026.08.04</text><text x="743" y="304" font-size="29" font-weight="900" fill="#203e2e" text-anchor="start">충북혁신도시 버스터미널 앞</text><text x="743" y="349" font-size="29" font-weight="900" fill="#203e2e" text-anchor="start">불법 주정차 '24시간 단속'</text><rect x="742" y="404" width="547" height="2" rx="0" fill="#dce7de" stroke-width="2" stroke="none"/><text x="743" y="454" font-size="21" font-weight="670" fill="#4d6d59" text-anchor="start">같은 구간의 CCTV 단속 강화 보도</text><text x="743" y="495" font-size="21" font-weight="670" fill="#4d6d59" text-anchor="start">주말·공휴일·점심시간 유예 없음</text><rect x="743" y="584" width="545" height="48" rx="9" fill="#edf4ee" stroke-width="2" stroke="none"/><text x="764" y="615" font-size="18" font-weight="780" fill="#41765b" text-anchor="start">소진섭 기자 · 원문 확인 링크</text><rect x="90" y="718" width="1220" height="1" rx="0" fill="#e0eae0" stroke-width="2" stroke="none"/><text x="93" y="748" font-size="16" font-weight="600" fill="#7b9180" text-anchor="start">기사 제목·언론사·날짜는 실제 자료 기준 / 설명은 연수용 요약 · 원문은 링크로 확인</text></svg>