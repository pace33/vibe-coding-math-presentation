name: Refresh LocalCheck student regional news headlines
on:
  schedule:
    - cron: '17 22 * * *' # 07:17 Korea time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localcheck-news-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Fetch RSS headline metadata
        run: python3 local-check/student/tools/update_news.py
      - name: Commit only changed headline JSON
        run: |
          if git diff --quiet -- local-check/student/latest.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "LocalCheck News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-check/student/latest.json
          git commit -m "data: refresh unverified regional headline links"
          git push
