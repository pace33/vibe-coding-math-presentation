<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="자연환경 지역 산 강 하천 저수지 학습카드 재구성"><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;letter-spacing:-1px}</style><rect width="1400" height="800" fill="#f3f8f1"/><rect x="42" y="29" width="1316" height="742" rx="28" fill="white"/><rect x="42" y="29" width="1316" height="77" rx="25" fill="#194731"/><rect x="42" y="80" width="1316" height="26" fill="#194731"/><text x="97" y="79" font-size="29" font-weight="850" fill="white">우리 지역 탐정 · 자연환경</text><text x="1280" y="79" text-anchor="end" font-size="18" font-weight="650" fill="#c8e4cd">사회 [4사10-01]</text><text x="97" y="159" font-size="34" font-weight="850" fill="#244c38">실제 지명을 바로 확인하고, 지역의 자연환경을 탐색해요</text>
