<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-label="④ 실시간 뉴스 검색을 연결하다"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6faf6"/><stop offset="1" stop-color="#e8f3eb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102d1e" flood-opacity=".09"/></filter></defs><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.6px}</style><rect x="0" y="0" width="1400" height="800" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/><rect x="37" y="27" width="1326" height="745" rx="24" fill="#fff" stroke="#dce8df" stroke-width="2"/><rect x="37" y="27" width="1326" height="70" rx="24" fill="#173d30" stroke="none" stroke-width="1"/><rect x="37" y="72" width="1326" height="25" rx="0" fill="#173d30" stroke="none" stroke-width="1"/><text x="77" y="72" font-size="17" fill="#e3e88b" font-weight="600" text-anchor="start">●</text><text x="102" y="72" font-size="17" fill="#b0d6ba" font-weight="600" text-anchor="start">●</text><text x="127" y="72" font-size="17" fill="#87b7aa" font-weight="600" text-anchor="start">●</text><text x="184" y="72" font-size="28" fill="#ffffff" font-weight="800" text-anchor="start">④ 실시간 뉴스 검색을 연결하다</text><text x="1320" y="72" font-size="15" fill="#cbe6d7" font-weight="600" text-anchor="end">구글·빙 RSS 제공자 표시</text><rect x="96" y="130" width="1208" height="539" rx="22" fill="#f9fbf9" stroke="none" stroke-width="1"/><text x="138" y="177" font-size="32" fill="#17372d" font-weight="800" text-anchor="start">지역 뉴스 찾기</text><rect x="138" y="203" width="795" height="66" rx="13" fill="#fff" stroke="#dce8df" stroke-width="2"/><text x="160" y="246" font-size="24" fill="#17372d" font-weight="600" text-anchor="start">예: 옥천군 환경</text><rect x="956" y="210" width="270" height="45" rx="12" fill="#1d7155" stroke="none" stroke-width="1"/><text x="1091" y="240" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">뉴스 검색</text><rect x="142" y="302" width="1075" height="57" rx="12" fill="#e8f3eb" stroke="none" stroke-width="1"/><text x="164" y="339" font-size="21" fill="#1d7155" font-weight="800" text-anchor="start">결과 제공처: 빙 뉴스 RSS 또는 구글 뉴스 RSS (응답 기준)</text><rect x="142" y="383" width="1075" height="126" rx="20" fill="#fff" stroke="#dce8df" stroke-width="2"/><rect x="142" y="383" width="6" height="126" rx="3" fill="#1d7155" stroke="none" stroke-width="1"/><text x="169" y="430" font-size="28" fill="#17372d" font-weight="800" text-anchor="start">기사 제목 예시 A</text><text x="169" y="468" font-size="19" fill="#71857a" font-weight="500" text-anchor="start">언론사·발행 날짜·원문 확인   |   검증하기</text><rect x="142" y="522" width="1075" height="126" rx="20" fill="#fff" stroke="#dce8df" stroke-width="2"/><rect x="142" y="522" width="6" height="126" rx="3" fill="#1d7155" stroke="none" stroke-width="1"/><text x="169" y="569" font-size="28" fill="#17372d" font-weight="800" text-anchor="start">기사 제목 예시 B</text><text x="169" y="607" font-size="19" fill="#71857a" font-weight="500" text-anchor="start">검색 결과는 사실로 확정된 자료가 아닙니다.</text><text x="1045" y="683" font-size="17" fill="#71857a" font-weight="500" text-anchor="end">※ 기사 제목은 화면 구성 예시입니다.</text><rect x="74" y="722" width="1250" height="1" rx="0" fill="#e4ede7" stroke="none" stroke-width="1"/><text x="77" y="747" font-size="17" fill="#73877b" font-weight="500" text-anchor="start">이미지 기반 제작 과정 시연 · 화면 구성 예시</text><text x="1318" y="747" font-size="17" fill="#557566" font-weight="700" text-anchor="end">우리 지역 탐정</text></svg>