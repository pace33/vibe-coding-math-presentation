<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="역사와 문화 · 지역 축제와 문화유산"><style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.45px}</style><rect x="0" y="0" width="1400" height="800" rx="0" fill="#f4f8f3" stroke="none" stroke-width="1.8"/><rect x="45" y="33" width="1310" height="735" rx="25" fill="#fff" stroke="#d7e5da" stroke-width="1.8"/><rect x="45" y="33" width="1310" height="75" rx="20" fill="#1d4b38" stroke="#d7e5da" stroke-width="1.8"/><rect x="45" y="80" width="1310" height="28" rx="0" fill="#1d4b38" stroke="#d7e5da" stroke-width="1.8"/><text x="89" y="81" font-size="30" fill="#fff" font-weight="850" text-anchor="start">우리 지역 탐정</text><text x="1305" y="81" font-size="19" fill="#cae8d5" font-weight="650" text-anchor="end">사회 [4사09-02]</text><text x="97" y="164" font-size="35" fill="#1e4c35" font-weight="850" text-anchor="start">역사와 문화 · 지역 축제와 문화유산</text><text x="105" y="221" font-size="23" fill="#5d7a67" font-weight="650" text-anchor="start">같은 지역의 문화 자원을 여러 모습으로 조사합니다.</text><rect x="108" y="260" width="371" height="270" rx="17" fill="#f8faf7" stroke="#d7e5da" stroke-width="1.8"/><text x="133" y="350" font-size="29" fill="#1d4e38" font-weight="850" text-anchor="start">문화유산</text><text x="133" y="400" font-size="20" fill="#6a826d" font-weight="650" text-anchor="start">지역 유적과 옛 이야기</text><rect x="130" y="443" width="321" height="49" rx="10" fill="#e7f2e9" stroke="#d7e5da" stroke-width="1.8"/><text x="289" y="475" font-size="19" fill="#2c634b" font-weight="780" text-anchor="middle">공식 자료 확인</text><rect x="507" y="260" width="371" height="270" rx="17" fill="#f8faf7" stroke="#d7e5da" stroke-width="1.8"/><text x="532" y="350" font-size="29" fill="#1d4e38" font-weight="850" text-anchor="start">박물관·미술관</text><text x="532" y="400" font-size="20" fill="#6a826d" font-weight="650" text-anchor="start">실물 자료와 작품 관람</text><rect x="529" y="443" width="321" height="49" rx="10" fill="#e7f2e9" stroke="#d7e5da" stroke-width="1.8"/><text x="688" y="475" font-size="19" fill="#2c634b" font-weight="780" text-anchor="middle">공식 자료 확인</text><rect x="906" y="260" width="371" height="270" rx="17" fill="#f2f7e7" stroke="#d7e5da" stroke-width="1.8"/><text x="931" y="350" font-size="29" fill="#1d4e38" font-weight="850" text-anchor="start">축제·공연</text><text x="931" y="400" font-size="20" fill="#6a826d" font-weight="650" text-anchor="start">문화를 알리려는 지역의 노력</text><rect x="928" y="443" width="321" height="49" rx="10" fill="#d9ecaf" stroke="#d7e5da" stroke-width="1.8"/><text x="1087" y="475" font-size="19" fill="#2c634b" font-weight="780" text-anchor="middle">축제 기사 검증</text><rect x="105" y="579" width="1178" height="90" rx="14" fill="#f4f8ed" stroke="#d7e5da" stroke-width="1.8"/><text x="135" y="631" font-size="23" fill="#2c654d" font-weight="850" text-anchor="start">교과서 활동: 우리 지역 자랑거리 한 곳 선택 → 특징과 의미 소개</text><rect x="97" y="716" width="1198" height="1" rx="0" fill="#e4eee6" stroke="#d7e5da" stroke-width="1.8"/><text x="100" y="746" font-size="18" fill="#819a89" font-weight="500" text-anchor="start">학생용 웹앱의 기능을 설명하기 위한 재구성 예시 화면</text></svg>